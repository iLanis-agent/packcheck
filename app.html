<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackCheck</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#2c2620; --muted:#8d8478; --blue:#3b6ea5; --amber:#d98e2b; --green:#3d8a4f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px 8px; }
  h1 { margin:0; font-size:1.5rem; }
  .sub { color:var(--muted); margin:4px 0 0; font-size:.9rem; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 40px; }
  .new-list { display:flex; gap:8px; margin-bottom:16px; }
  input, button { font:inherit; padding:8px 10px; border:1px solid #ddd5c8; border-radius:8px; background:#fff; }
  input[type=text] { flex:1; min-width:140px; }
  button { background:var(--blue); color:#fff; border:none; cursor:pointer; }
  button.ghost { background:#efe9df; color:var(--ink); }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .lname { font-weight:600; font-size:1.05rem; }
  .bar { height:8px; background:#ece5d8; border-radius:999px; overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; background:var(--green); transition:width .2s; }
  .meta { font-size:.82rem; color:var(--muted); }
  .warn { color:var(--amber); font-weight:600; }
  .ready { color:var(--green); font-weight:600; }
  ul.items { list-style:none; padding:0; margin:10px 0 0; }
  li.item { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid #f0ebe1; }
  li.item label { flex:1; cursor:pointer; display:flex; align-items:center; gap:8px; }
  li.item.packed label span.txt { text-decoration:line-through; color:var(--muted); }
  .ess { font-size:.7rem; font-weight:700; color:var(--amber); border:1px solid var(--amber); border-radius:999px; padding:1px 7px; }
  .del { background:none; color:#b0a696; border:none; cursor:pointer; font-size:1rem; padding:2px 6px; }
  .add-row { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .add-row input { flex:1; min-width:120px; }
  .add-row label { font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>PackCheck</h1>
  <p class="sub">Reusable packing lists. Build the list once, check things off as they go in the bag, reset for next time.</p>
</header>
<main>
  <div class="new-list">
    <input type="text" id="nl-name" placeholder="New list name (e.g. Gym bag, Work trip)" maxlength="40">
    <button id="nl-add">New list</button>
  </div>
  <div id="lists"></div>
</main>
<script src="engine.js"></script>
<script>
(function () {
  var KEY = 'packcheck-v1';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(lists)); }
  var lists = load();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    var wrap = document.getElementById('lists');
    wrap.innerHTML = '';
    if (!lists.length) {
      wrap.innerHTML = '<div class="empty">No lists yet. Make one for the bag you pack most.</div>';
      return;
    }
    lists.forEach(function (list) {
      var p = PackCheck.progress(list);
      var card = el('div', 'card');
      var top = el('div', 'row');
      top.appendChild(el('span', 'lname', list.name));
      var delList = el('button', 'ghost', 'Delete list');
      delList.onclick = function () {
        if (!confirm('Delete "' + list.name + '" and its ' + list.items.length + ' items?')) return;
        lists = lists.filter(function (l) { return l.id !== list.id; });
        save(); render();
      };
      top.appendChild(delList);
      card.appendChild(top);

      var bar = el('div', 'bar');
      var fill = el('div'); fill.style.width = p.pct + '%';
      bar.appendChild(fill);
      card.appendChild(bar);

      var meta = el('div', 'meta');
      if (p.ready) { meta.className = 'meta ready'; meta.textContent = 'All packed. Go.'; }
      else if (p.missingEssentials.length) {
        meta.className = 'meta warn';
        meta.textContent = p.packed + '/' + p.total + ' packed - still missing: ' + p.missingEssentials.map(function (i) { return i.text; }).join(', ');
      } else { meta.textContent = p.packed + '/' + p.total + ' packed'; }
      card.appendChild(meta);

      var ul = el('ul', 'items');
      list.items.forEach(function (item) {
        var li = el('li', 'item' + (item.packed ? ' packed' : ''));
        var label = el('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = item.packed;
        cb.onchange = function () { PackCheck.toggleItem(list, item.id); save(); render(); };
        var txt = el('span', 'txt', item.text);
        label.appendChild(cb); label.appendChild(txt);
        li.appendChild(label);
        if (item.essential) li.appendChild(el('span', 'ess', 'ESSENTIAL'));
        var del = el('button', 'del', 'x');
        del.title = 'Remove item';
        del.onclick = function () { PackCheck.removeItem(list, item.id); save(); render(); };
        li.appendChild(del);
        ul.appendChild(li);
      });
      card.appendChild(ul);

      var add = el('div', 'add-row');
      var inp = el('input'); inp.type = 'text'; inp.placeholder = 'Add item'; inp.maxLength = 60;
      var essL = el('label');
      var essC = document.createElement('input'); essC.type = 'checkbox';
      essL.appendChild(essC); essL.appendChild(document.createTextNode('essential'));
      var addB = el('button', 'ghost', 'Add');
      function doAdd() {
        try { PackCheck.addItem(list, inp.value, essC.checked); }
        catch (e) { alert(e.message); return; }
        inp.value = ''; essC.checked = false; save(); render();
      }
      addB.onclick = doAdd;
      inp.onkeydown = function (e) { if (e.key === 'Enter') doAdd(); };
      add.appendChild(inp); add.appendChild(essL); add.appendChild(addB);
      card.appendChild(add);

      if (list.items.length) {
        var reset = el('button', 'ghost', 'Reset for next time');
        reset.style.marginTop = '10px';
        reset.onclick = function () { PackCheck.resetList(list); save(); render(); };
        card.appendChild(reset);
      }
      wrap.appendChild(card);
    });
  }

  document.getElementById('nl-add').onclick = function () {
    var inp = document.getElementById('nl-name');
    try { lists.push(PackCheck.makeList(inp.value)); }
    catch (e) { alert(e.message); return; }
    inp.value = ''; save(); render();
  };
  render();
})();
</script>
</body>
</html>
